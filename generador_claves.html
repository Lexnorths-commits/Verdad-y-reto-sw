<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Generador Lexnorths</title><style>body{background:#111;color:#fff;font-family:system-ui;padding:20px;max-width:500px;margin:auto}.card{background:#222;border-radius:15px;padding:20px;border:1px solid #333}input,button{width:100%;padding:14px;border-radius:10px;border:none;margin:8px 0;font-size:16px}button{background:#25D366;color:#000;font-weight:bold}button.sec{background:#333;color:#fff}.key{background:#000;border:1px dashed #555;padding:12px;border-radius:8px;margin:8px 0;font-family:monospace;font-size:18px;text-align:center;letter-spacing:2px}.small{font-size:12px;color:#888}</style></head><body><h2>🔐 Generador Lexnorths</h2><div class="card"><label>Cliente</label><input id="cliente" placeholder="Ej: Pareja Tlalpan"><label>Dias</label><input id="dias" type="number" value="30"><button onclick="generar()">GENERAR CLAVE</button><div id="resultado"></div><button class="sec" onclick="copiar()">COPIAR CLAVE</button><h3>Historial</h3><div id="historial"></div></div><script>function makeKey(){const c='ABCDEFGHJKMNPQRSTUVWXYZ23456789';let a='',b='';for(let i=0;i<4;i++){a+=c[Math.floor(Math.random()*c.length)]}for(let i=0;i<4;i++){b+=c[Math.floor(Math.random()*c.length)]}return 'TL-'+a+'-'+b}function generar(){const cliente=document.getElementById('cliente').value||'Cliente';const dias=parseInt(document.getElementById('dias').value)||30;const clave=makeKey();const ex=new Date();ex.setDate(ex.getDate()+dias);const data={clave,cliente,dias,ex:ex.toLocaleDateString()};document.getElementById('resultado').innerHTML='<div class=key id=claveActual>'+clave+'</div><div class=small>'+cliente+' - '+data.ex+'</div>';let h=JSON.parse(localStorage.getItem('lex_keys')||'[]');h.unshift(data);localStorage.setItem('lex_keys',JSON.stringify(h));renderHist()}function renderHist(){let h=JSON.parse(localStorage.getItem('lex_keys')||'[]');document.getElementById('historial').innerHTML=h.map(x=>'<div class=key style=font-size:14px>'+x.clave+'<br><span class=small>'+x.cliente+' - '+x.ex+'</span></div>').join('')}function copiar(){const t=document.getElementById('claveActual');navigator.clipboard.writeText(t.innerText);alert('Copiada: '+t.innerText)}renderHist();</script></body></html>
