<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>@lexnorths 1-5</title><style>body{background:#060606;color:#f7d7b5;font-family:Arial;display:flex;justify-content:center;margin:0}.w{max-width:400px;width:100%;padding:16px}.h{text-align:center;padding:15px;border-bottom:1px solid #222}.lv{display:flex;gap:5px;margin-top:10px}.lv div{flex:1;padding:8px;border-radius:20px;text-align:center;font-size:11px;font-weight:800;border:1px solid #333;background:#111;color:#555}.lv .on{background:#f7d7b5;color:#000}.card{background:#121212;border:1px solid #f7d7b5;border-radius:20px;padding:25px;min-height:150px;display:flex;align-items:center;justify-content:center;font-size:18px;text-align:center;margin-top:15px}.btn{width:100%;padding:14px;border-radius:12px;border:0;font-weight:800;margin-top:10px}.gold{background:#f7d7b5;color:#000}.wa{background:#25D366;color:#fff}</style></head>
<body><div class="w"><div class="h"><b>@lexnorths</b><div style="font-size:10px;opacity:.5;letter-spacing:2px">JUEGO COMPLETO 1 AL 5</div><div class="lv"><div id="a1" class="on" onclick="cn(1)">N1</div><div id="a2" onclick="cn(2)">N2</div><div id="a3" onclick="cn(3)">N3</div><div id="a4" onclick="cn(4)">N4</div><div id="a5" onclick="cn(5)">N5</div></div></div><p id="co" style="font-size:10px;opacity:.5;text-align:center;margin-top:10px">NIVEL 1</p><div class="card" id="ca">Toca SIGUIENTE para empezar en N1 Suave</div><button class="btn gold" onclick="sig()">SIGUIENTE CARTA ❤️</button><button class="btn wa" onclick="let t=encodeURIComponent('Estoy jugando el juego de @lexnorths hasta Nivel 5 🔥');window.open('https://wa.me/?text='+t)">COMPARTIR EN WHATSAPP</button></div>
<script>
let niveles={1:["Beso 10 seg mirándose a los ojos","Díganse 3 cosas que aman del otro","Abrazo 1 min sin hablar","Beso en frente y di te amo","Masaje hombros 2 min","Tómense de manos ojos cerrados 30 seg","Beso suave mejilla cuello frente","Cuenten su primer recuerdo juntos","Bailen pegados lento","Pidan un deseo bonito"],2:["Beso apasionado 30 seg","Susurra qué te prende de tu pareja","Beso cuello lento 20 seg","Acaricia espalda por dentro ropa","Mordida suave labio","Masaje cintura 1 min","Beso con lengua 15 seg","Quítale una prenda lentamente","Mírense ojos y digan algo atrevido","Abrazo por detrás beso cuello"],3:["Quítense una prenda el uno al otro","Beso en 3 partes diferentes cuerpo","Lame lóbulo oreja 10 seg","Masaje piernas 2 min","Susurra tu fantasía suave","Beso largo abdomen","Desvístanse hasta ropa interior","Beso con lengua por todo cuello","Acaricia pecho por encima ropa","Pídele algo que nunca te has atrevido"],4:["Beso solo lengua 1 min en cuello","Masaje interno muslos 2 min","Quítense ropa interior ojos cerrados","Beso largo donde pareja elija","Susurra gimiendo lo que sientes","Juego hielo: pasen hielo por pecho","Tu pareja manda 2 min tú obedeces","Chupetón suave donde elija","Lame lentamente torso","Confesión: qué te gustaría probar"],5:["N5: Quita prenda usando solo boca","N5: Beso 90 seg sin manos","N5: Beso lento cuello 1 min","N5: Masaje interno muslos 2 min","N5: Susurra qué quieres que te haga","N5: Besa 3 zonas que ame (no labios)","N5: Desvístanse sin manos solo cuerpo","N5: Abrazo detrás + besos cuello 1 min","N5: Mírense desnudos 30 seg provocando","N5 FINAL: Hagan el amor lento 🔥"]};
let na=1,ix=0;function cn(n){na=n;ix=0;document.querySelectorAll('.lv div').forEach(e=>e.classList.remove('on'));document.getElementById('a'+n).classList.add('on');sig(true)}
function sig(nuevo=false){let l=niveles[na];if(nuevo)ix=0;if(ix>=l.length)ix=0;ca.innerText=l[ix];co.innerText='NIVEL '+na+' - CARTA '+(ix+1)+' / '+l.length;ix++; if(ix>=l.length&&na<5){setTimeout(()=>{if(confirm('¡Terminaste Nivel '+na+'! ¿Pasar a Nivel '+(na+1)+'?'))cn(na+1)},400)}}
</script></body></html>
